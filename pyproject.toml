[project]
name = "fake-review-graph-demo"
version = "0.1.0"
description = "What graph features add to fake review detection on the public YelpChi benchmark, measured at a fixed false positive rate, plus FRAUDAR style ring detection with evidence per group."
authors = [
    { name = "Deleuzy", email = "146382697+Deleuzy@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "frgraph"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
